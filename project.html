<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="作品详情">
  <title>作品详情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="project.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="project.js" type="module"></script>
</head>
<body class="project-page">
  <header class="site-header" id="top">
    <a class="brand" href="index.html#home" id="project-logo">LUMI.</a>
    <nav class="site-nav project-nav" aria-label="页面导航">
      <a href="index.html#works">返回作品集</a>
      <a href="index.html#contact">联系我</a>
    </nav>
  </header>

  <main id="project-main" hidden>
    <section class="project-hero-detail">
      <div class="project-detail-copy">
        <p class="eyebrow" id="project-category">PROJECT</p>
        <p class="project-number" id="project-number">PROJECT / 01</p>
        <h1 id="project-title"></h1>
        <p class="project-summary" id="project-description"></p>
      </div>
      <figure class="project-detail-image">
        <div id="project-hero-media"></div>
      </figure>
    </section>

    <section class="project-story">
      <div class="project-story-label">
        <span>SELECTED WORK</span>
        <span id="project-story-category">UI/UX</span>
      </div>
      <div class="project-story-copy">
        <p class="eyebrow">PROJECT NOTES</p>
        <h2>把问题讲清楚，<br>让体验自然发生。</h2>
        <p id="project-detail"></p>
      </div>
    </section>

    <section class="project-gallery-section" id="project-gallery-section" hidden>
      <div class="project-gallery-heading">
        <p class="eyebrow">PROJECT MEDIA</p>
        <p>图片与视频记录</p>
      </div>
      <div class="project-gallery" id="project-gallery"></div>
    </section>

    <nav class="project-pager" aria-label="作品翻页">
      <a id="previous-project" href="#" hidden><span>上一个项目</span><strong></strong><i data-lucide="arrow-left"></i></a>
      <a id="next-project" href="#" hidden><span>下一个项目</span><strong></strong><i data-lucide="arrow-right"></i></a>
    </nav>
  </main>

  <button class="edit-fab project-edit-fab" id="project-edit" type="button" aria-label="编辑此项目" title="编辑此项目" hidden>
    <i data-lucide="pencil-line"></i>
  </button>

  <div class="project-error" id="project-error" hidden>
    <p class="eyebrow">404 / PROJECT</p>
    <h1>找不到这个作品</h1>
    <a class="text-link" href="index.html#works">返回作品集 <i data-lucide="arrow-left"></i></a>
  </div>

  <div class="detail-editor-shell" id="detail-editor" hidden>
    <button class="editor-scrim" id="detail-scrim" type="button" aria-label="关闭项目编辑器"></button>
    <aside class="detail-editor-panel" role="dialog" aria-modal="true" aria-labelledby="detail-editor-title">
      <header class="editor-header">
        <div>
          <p class="eyebrow">PROJECT EDITOR</p>
          <h2 id="detail-editor-title">编辑此项目</h2>
        </div>
        <button class="icon-button" id="detail-close" type="button" aria-label="关闭" title="关闭"><i data-lucide="x"></i></button>
      </header>
      <form class="detail-editor-form" id="detail-form">
        <label>项目名称<input id="detail-title-input" required autocomplete="off"></label>
        <label>分类<input id="detail-category-input" required autocomplete="off"></label>
        <label>卡片简介<textarea id="detail-description-input" rows="3" required></textarea></label>
        <label>子页面正文<textarea id="detail-body-input" rows="8" placeholder="写下这个项目的背景、过程和结果"></textarea></label>
        <div class="detail-media-editor">
          <div class="detail-media-editor-header">
            <div><strong>项目媒体</strong><span>可添加多张图片或视频</span></div>
            <label class="button button-secondary button-small file-button"><i data-lucide="plus"></i> 添加媒体<input id="detail-image-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/ogg" multiple></label>
          </div>
          <div id="detail-media-list"></div>
        </div>
      </form>
      <div class="detail-publish-box">
        <label>GitHub 访问令牌
          <input id="detail-token" type="password" placeholder="github_pat_... 或 ghp_..." autocomplete="off" spellcheck="false">
        </label>
        <p class="publish-note">保存后只更新当前项目，GitHub Pages 会自动部署。</p>
        <div class="detail-publish-actions">
          <span class="save-status" id="detail-status" role="status"></span>
          <button class="button button-primary" id="detail-save" type="button"><i data-lucide="cloud-upload"></i> 保存项目</button>
        </div>
      </div>
    </aside>
  </div>
  <div class="toast" id="detail-toast" role="status" aria-live="polite"></div>
</body>
</html>
